services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messmate-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: messmate-frontend
    ports:
      - "5174:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_API_BASE_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
